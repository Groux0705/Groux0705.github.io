baseURL = 'https://groux0705.github.io/'
languageCode = 'zh-CN'
defaultContentLanguage = 'zh-cn'
title = 'Groux'
enableGitInfo = true
enableRobotsTXT = true

[module]
  [[module.imports]]
    path = 'github.com/adityatelange/hugo-PaperMod'

[frontmatter]
  lastmod = ['lastmod', ':fileModTime', ':git', 'date', 'publishDate']

[params]
  author = 'Groux'
  description = 'Groux 的个人空间'
  DateFormat = "2006 年 01 月 02 日 15:04"
  ShowReadingTime = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  defaultTheme = 'auto'

[params.assets]
  favicon = "logo.png"
  favicon16x16 = "logo.png"
  favicon32x32 = "logo.png"
  apple_touch_icon = "logo.png"
  safari_pinned_tab = "logo.png"

[params.label]
  icon = "logo.png"
  iconHeight = 30

[params.homeInfoParams]
  Title = ""
  Content = "投资 ｜ 情感 ｜ 心理学 ｜ 发疯"

[params.footer]
  text = "[GitHub](https://github.com/Groux0705) · [RSS](/index.xml)"

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/Groux0705"

[[params.socialIcons]]
  name = "rss"
  url = "/index.xml"

[[menu.main]]
  name = "首页"
  url = "/"
  weight = 10

[[menu.main]]
  name = "文章"
  url = "/posts/"
  weight = 20

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 30
